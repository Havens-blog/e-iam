version: '3'

dotenv: ['.env']

env:
  EGO_DEBUG: "true"

tasks:
  default:
    desc: 命令提示
    cmds:
      - task --list-all
  run:
    desc: 启动服务
    cmds:
      -  EGO_DEBUG=true go run main.go server
  gen:
    desc: 代码生成（本地 protoc 管线，见 scripts/gen-proto.ps1；BSR 可达环境可换回 buf generate api/proto，见 buf.gen.yaml 注释）
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/gen-proto.ps1
  gen:perm:
    desc: 运行 AST 权限扫描与代码/文档生成
    cmds:
      - go run ./cmd/permgen
  gen:swagger:
    desc: 运行独立 OpenAPI/Swagger 接口文档与交互页面生成
    cmds:
      - go run ./cmd/swaggergen
  mock:
    desc: 生成 Mock 代码
    cmds:
      - go generate ./...
  bench:
    desc: 运行全量基准测试并输出性能与内存分配报表
    cmds:
      - go test -run=^$ -bench=. -benchmem ./...

